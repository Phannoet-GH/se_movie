services:
  - type: web
    name: cinepulse-movie
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: APP_NAME
        value: CinePulse
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
